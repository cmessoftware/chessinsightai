# Render Blueprint - Chess Trainer AI Coach
# https://render.com/docs/blueprint-spec

services:
  # PostgreSQL Database
  - type: pserv
    name: chess-trainer-db
    env: docker
    plan: standard # Required for persistent storage
    dockerfilePath: ./dockerfile.postgres
    envVars:
      - key: POSTGRES_DB
        value: chess_trainer
      - key: POSTGRES_USER
        generateValue: true
      - key: POSTGRES_PASSWORD
        generateValue: true
    disk:
      name: postgres-data
      mountPath: /var/lib/postgresql/data
      sizeGB: 10

  # Main Application + AI Coach + Ollama
  - type: web
    name: chess-trainer-ai-coach
    env: docker
    dockerfilePath: ./dockerfile.render
    plan: pro # Required: Minimum 8GB RAM for LLM
    healthCheckPath: /health
    envVars:
      - key: CHESS_TRAINER_DB_URL
        fromDatabase:
          name: chess-trainer-db
          property: connectionString
      - key: OLLAMA_MODEL
        value: llama3.1:8b
      - key: WORKERS
        value: 2
      - key: PORT
        value: 8000
      - key: PYTHONUNBUFFERED
        value: 1
    disk:
      name: ollama-models
      mountPath: /app/models
      sizeGB: 10 # For LLM models storage

  # Optional: MLflow Tracking Server
  - type: web
    name: chess-trainer-mlflow
    env: docker
    plan: starter
    dockerfilePath: ./dockerfile.notebooks
    healthCheckPath: /
    envVars:
      - key: MLFLOW_BACKEND_STORE_URI
        fromDatabase:
          name: chess-trainer-db
          property: connectionString
      - key: MLFLOW_DEFAULT_ARTIFACT_ROOT
        value: /app/mlartifacts
    disk:
      name: mlflow-artifacts
      mountPath: /app/mlartifacts
      sizeGB: 5

  # ChessDash UI. Same name as the published static site so a Blueprint sync
  # updates that service. Render serves a real file before any rewrite, so
  # /assets and other build output stay intact. Unlisted paths, including
  # /api, stay 404. Render does not read public/_redirects.
  - type: web
    name: chessdash-frontend
    runtime: static
    rootDir: src/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./src/frontend/dist
    routes:
      - type: rewrite
        source: /login
        destination: /index.html
      - type: rewrite
        source: /unauthorized
        destination: /index.html
      - type: rewrite
        source: /chess-board
        destination: /index.html
      - type: rewrite
        source: /chess-board/*
        destination: /index.html
      - type: rewrite
        source: /games
        destination: /index.html
      - type: rewrite
        source: /games/*
        destination: /index.html
      - type: rewrite
        source: /import
        destination: /index.html
      - type: rewrite
        source: /import/*
        destination: /index.html
      - type: rewrite
        source: /coach
        destination: /index.html
      - type: rewrite
        source: /coach/*
        destination: /index.html
      - type: rewrite
        source: /reports
        destination: /index.html
      - type: rewrite
        source: /reports/*
        destination: /index.html
      - type: rewrite
        source: /logs
        destination: /index.html
      - type: rewrite
        source: /admin
        destination: /index.html
      - type: rewrite
        source: /admin/*
        destination: /index.html

databases:
  - name: chess-trainer-db
    databaseName: chess_trainer
    plan: standard # $7/month
    ipAllowList: [] # Allow all (or restrict to your IPs)
