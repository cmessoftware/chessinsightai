name: chess_trainer_tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHONPATH: src:src/api
  # Avoid leaking local-style tokens into Lichess client header tests
  LICHESS_API_TOKEN: ""
  LICHESS_TOKEN: ""

jobs:
  coach-mvp:
    name: Coach MVP (P0-1)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-coach-mvp.txt
            src/api/requirements.txt

      - name: Install system Stockfish (optional live F07 tests)
        run: sudo apt-get update && sudo apt-get install -y stockfish

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run Coach MVP + F07 + LS01 tests
        env:
          STOCKFISH_PATH: /usr/games/stockfish
        run: |
          pytest tests/mvp tests/docs_courses tests/chess_statistics -q --tb=short

  legacy-full-stack:
    name: Legacy full requirements (informational)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install legacy requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect legacy test suite
        run: pytest tests/ --collect-only -q
        continue-on-error: true
